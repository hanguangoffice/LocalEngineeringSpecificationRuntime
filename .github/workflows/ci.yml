name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python scripts/verify_baseline_manifest.py
      - run: uv run ruff check .
      - run: uv run mypy src prototypes
      - run: uv run pytest
