name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --all-extras
      - run: uv run playwright install chromium
        if: runner.os == 'Linux'
      - run: uv run python scripts/verify_baseline_manifest.py
      - run: uv run python scripts/verify_construction_schemas.py
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build --wheel --sdist --out-dir release-dist
      - run: uv run python scripts/verify_distribution.py release-dist
