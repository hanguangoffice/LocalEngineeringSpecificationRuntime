[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lesr"
version = "1.0.0a3"
description = "Local Engineering Specification Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "typer>=0.15",
  "jsonschema>=4.23",
  "mcp>=1.0,<2",
  "cryptography>=45.0",
  "platformdirs>=4.3",
  "pypdf>=6.0,<7",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "keyring>=25.6,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.14", "types-jsonschema>=4.23", "httpx>=0.28,<1", "playwright>=1.54,<2"]

[project.scripts]
lesr = "lesr.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lesr"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1" = "lesr/schemas/v1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "local_corpus: uses uncommitted local evaluation documents",
  "playwright: launches the packaged local Web UI in Chromium",
  "performance: executes fixed LESR performance datasets",
]
