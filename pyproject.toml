[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lesr"
version = "0.1.0"
description = "Local Engineering Specification Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "typer>=0.15",
  "jsonschema>=4.23",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.14", "types-PyYAML>=6.0", "types-jsonschema>=4.23"]

[project.scripts]
lesr = "lesr.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lesr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
